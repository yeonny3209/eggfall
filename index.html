<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGGFALL — Phase 0</title>
<style>
  :root{
    --tx:#e9f0fb; --tx2:#9db0cc; --tx3:#63748f;
    --good:#6ee7d7; --bad:#ff5c6c; --warn:#ffc93c; --acc:#8fb8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0b1220}
  body{
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    color:var(--tx); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  #game{display:block;width:100%;height:100%;cursor:crosshair}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hud-left{position:absolute;left:22px;bottom:22px;display:flex;flex-direction:column;gap:9px}
  .gauge{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums}
  .gauge .label{font-size:11px;color:var(--tx3);letter-spacing:.08em;width:30px}
  .gauge b{font-size:30px;font-weight:700;line-height:1;min-width:74px;
           text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .gauge .unit{font-size:11px;color:var(--tx3)}

  .stam{display:flex;align-items:center;gap:9px;margin-top:3px}
  .stam-bar{width:190px;height:9px;background:rgba(8,14,24,.85);
            border:1px solid #24354f;border-radius:5px;overflow:hidden}
  .stam-bar i{display:block;height:100%;width:100%;
              background:linear-gradient(90deg,#2e8b8b,#6ee7d7);transition:width .08s linear}
  .stam .label{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;min-width:26px}

  .layer{font-size:11.5px;color:var(--tx2);letter-spacing:.04em;margin-top:2px}
  .layer.high{color:var(--warn)}
  .layer.low{color:#9dd648}

  .hud-center{position:absolute;left:50%;top:19%;transform:translateX(-50%);text-align:center}
  .alert{font-size:15px;font-weight:700;letter-spacing:.03em;min-height:22px;
         text-shadow:0 2px 12px rgba(0,0,0,.85);opacity:.95}
  .alert.bad{color:var(--bad)}
  .alert.good{color:var(--good)}
  .alert.warn{color:var(--warn)}
  .alert.dive{color:var(--acc)}

  .hud-right{position:absolute;right:22px;bottom:22px;text-align:right}
  @media(max-height:620px){.radar{width:110px;height:110px}}
  .stage{font-size:13px;color:var(--tx2);font-weight:700;margin-bottom:9px;letter-spacing:.05em}
  .keys{font-size:11px;color:var(--tx3);line-height:1.85}
  .keys .dim{color:#4a5870;margin-top:5px}
  kbd{display:inline-block;background:rgba(28,40,60,.9);border:1px solid #33445f;
      border-radius:4px;padding:0 5px;margin-right:2px;font-family:inherit;
      font-size:10.5px;color:var(--tx2)}

  /* 상승기류 레이더 — 핵심 자원을 눈으로만 찾게 두면 대부분 놓친다 */
  .radar{position:absolute;right:22px;top:22px;width:150px;height:150px;opacity:.92}

  /* 성장 패널 — 단계·유전질량·친화도 (§6) */
  .growth{margin-top:9px;min-width:210px}
  .gr-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .gr-row b{font-size:14px;font-weight:700;letter-spacing:.04em}
  .gr-row span{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .gr-bar{height:6px;background:rgba(8,14,24,.85);border:1px solid #24354f;
          border-radius:4px;overflow:hidden;margin-top:4px}
  .gr-bar i{display:block;height:100%;width:0;
            background:linear-gradient(90deg,#c98bff,#7ce0ff);transition:width .25s}
  .gr-sub{font-size:10.5px;color:var(--tx3);margin-top:4px}

  /* 운반 표시 — 알을 든 순간 취약해진다는 걸 계속 상기시킨다 (§2) */
  .carry{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
         text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;
         background:rgba(30,16,10,.82);border:1px solid #6b4630;border-radius:10px;
         padding:8px 16px;backdrop-filter:blur(6px)}
  .carry.on{opacity:1}
  .cr-head{font-size:10.5px;letter-spacing:.07em;color:#ffb27a}
  .cr-name{font-size:14px;font-weight:700;margin-top:3px}
  .cr-hint{font-size:11px;color:var(--tx2);margin-top:3px}

  /* 상호작용 프롬프트 */
  .prompt{position:absolute;left:50%;bottom:calc(50% - 78px);transform:translateX(-50%);
          font-size:13.5px;font-weight:600;opacity:0;transition:opacity .18s;
          background:rgba(9,14,24,.8);border:1px solid #2f4460;border-radius:8px;
          padding:6px 13px;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .prompt.on{opacity:1}

  /* 흡수 채널링 바 */
  .absorb{position:absolute;left:50%;top:56%;transform:translateX(-50%);
          width:230px;opacity:0;transition:opacity .18s;text-align:center}
  .absorb.on{opacity:1}
  .absorb i{display:block;height:7px;width:0;border-radius:4px;
            background:linear-gradient(90deg,#7ce0ff,#c98bff);transition:width .06s linear;
            box-shadow:0 0 12px rgba(124,224,255,.6)}
  .absorb span{display:block;font-size:11.5px;color:var(--tx2);margin-top:5px;
               text-shadow:0 2px 8px rgba(0,0,0,.85)}

  /* 알 파인더 — 8km 월드에서 눈으로만 찾으면 대부분 못 찾는다 */
  .eggfinder{position:absolute;right:22px;top:22px;min-width:172px;
             background:rgba(9,14,24,.72);border:1px solid #26374f;border-radius:10px;
             padding:9px 12px;backdrop-filter:blur(6px);transition:opacity .3s}
  .eggfinder.empty{opacity:.45}
  .eg-head{font-size:10.5px;letter-spacing:.08em;color:var(--tx3);margin-bottom:5px}
  .eg-row{display:flex;align-items:center;gap:8px}
  .eg-arrow{font-size:17px;line-height:1;display:inline-block;transition:transform .12s linear}
  .eg-name{font-size:13px;font-weight:700}
  .eg-dist{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;margin-top:3px}
  .eg-count{font-size:10.5px;color:var(--tx3);margin-top:2px}

  /* 속도 스트릭 — 가장자리가 흘러야 빠르다고 느낀다 */
  .streaks{position:absolute;inset:0;opacity:0;transition:opacity .18s;
           background:
             radial-gradient(ellipse 62% 58% at 50% 50%,
               rgba(255,255,255,0) 55%, rgba(190,220,255,.13) 100%);
           mix-blend-mode:screen}

  /* 상태 비네트 — 색 하나로 지금이 위험한지 신나는지 알린다 */
  .vignette{position:absolute;inset:0;transition:box-shadow .3s;box-shadow:none}
  .vignette.stall{box-shadow:inset 0 0 190px 30px rgba(255,60,80,.34)}
  .vignette.dive{box-shadow:inset 0 0 210px 40px rgba(90,160,255,.24)}
  .vignette.lift{box-shadow:inset 0 0 170px 26px rgba(80,230,215,.2)}

  .flash{position:absolute;left:50%;top:38%;transform:translateX(-50%);
         font-size:30px;font-weight:800;opacity:0;transition:opacity .25s;
         text-shadow:0 3px 18px rgba(0,0,0,.9);letter-spacing:.04em}
  .flash.on{opacity:1}

  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
        z-index:20;text-align:center;pointer-events:none;transition:opacity .5s}
  #hint h1{font-size:26px;letter-spacing:.14em;font-weight:800;margin-bottom:8px}
  #hint p{font-size:13px;color:var(--tx2);line-height:1.7}
  #hint.gone{opacity:0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="hint">
  <h1>EGGFALL</h1>
  <p>Phase 0 — 비행 컨트롤러<br>
     <b>W/S</b> 기수 · <b>A/D</b> 선회 · <b>Q/E</b> 롤 · <b>Space</b> 날갯짓 · <b>Shift</b> 급강하<br>
     푸른 기둥은 상승기류입니다. 스태미나 없이 고도를 얻을 수 있습니다.</p>
</div>
<script type="module" src="/src/main.ts"></script>
<script>
  // 첫 입력이 들어오면 안내를 치운다
  const hint = document.getElementById('hint');
  const clear = () => { hint.className = 'gone'; removeEventListener('keydown', clear); removeEventListener('mousedown', clear); };
  addEventListener('keydown', clear);
  addEventListener('mousedown', clear);
  setTimeout(clear, 9000);
</script>
</body>
</html>
